<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reset Exam Fortress</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="attack-shell" style="max-width: 560px; margin: 64px auto; padding: 20px;">
    <article class="admin-panel">
      <h1>Reset Exam Fortress</h1>
      <p>This clears saved profiles, questions, exam configurations, attempts, audit history, and local administrator settings from this browser.</p>
      <button class="danger-btn full" id="resetAll">Clear Exam Fortress data</button>
      <a class="hack-link" href="index.html">Cancel and return</a>
    </article>
  </main>
  <script>
    document.querySelector("#resetAll").addEventListener("click", () => {
      if (!confirm("Clear all locally stored Exam Fortress data?")) return;
      for (const key of Object.keys(localStorage)) {
        if (/^(nf[456]_|ef_(workspace|exam_catalog))/.test(key)) localStorage.removeItem(key);
      }
      location.href = "index.html";
    });
  </script>
</body>
</html>
